# Google App Engine (Standard, Python 3) — alternative to Cloud Run.
# Deploy with:  gcloud app deploy app.yaml
runtime: python312
entrypoint: uvicorn server:app --host 0.0.0.0 --port $PORT

instance_class: F1

automatic_scaling:
  min_instances: 0
  max_instances: 2

handlers:
  - url: /static
    static_dir: static
    secure: always
  - url: /.*
    script: auto
    secure: always
