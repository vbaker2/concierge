<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tallinn AI Concierge (POC)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .chat-bubble-user {
            background-color: #3B82F6; /* Blue-600 */
            color: white;
        }
        .chat-bubble-ai {
            background-color: #F3F4F6; /* Gray-100 */
            color: #1F2937; /* Gray-800 */
        }
        .smooth-scroll {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen">
    <div id="app" class="w-full max-w-lg h-[90vh] sm:h-[80vh] md:h-[700px] bg-white rounded-2xl shadow-2xl flex flex-col overflow-hidden">

        <!-- Header -->
        <header class="bg-white p-4 border-b border-gray-200 flex items-center shadow-sm z-10">
            <div class="w-12 h-12 bg-blue-500 rounded-full flex items-center justify-center mr-4">
                 <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </div>
            <div>
                <h1 class="text-xl font-bold text-gray-800">Tallinn Concierge</h1>
                <p class="text-sm text-gray-500">Your AI assistant for exploring the city</p>
            </div>
        </header>

        <!-- Chat Area -->
        <main id="chat-area" class="flex-1 p-6 overflow-y-auto bg-gray-50 smooth-scroll">
            <div class="space-y-6">
                <!-- Initial Welcome Message -->
                <div class="flex items-start gap-3 justify-start">
                    <div class="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center flex-shrink-0">
                       <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                    </div>
                    <div class="chat-bubble-ai p-4 rounded-lg rounded-tl-none max-w-sm">
                        <p class="text-sm">Tere! Hello! I'm your digital concierge. How can I help you explore Tallinn today? You can ask me about local tours, transport, or things to see.</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Typing Indicator -->
        <div id="typing-indicator" class="p-6 pt-0 hidden">
             <div class="flex items-start gap-3 justify-start">
                <div class="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center flex-shrink-0">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                </div>
                <div class="chat-bubble-ai p-4 rounded-lg rounded-tl-none max-w-sm">
                   <div class="flex items-center justify-center space-x-1">
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-pulse [animation-delay:-0.3s]"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-pulse [animation-delay:-0.15s]"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-pulse"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <footer class="bg-white p-4 border-t border-gray-200">
            <form id="chat-form" class="flex items-center gap-3">
                <input type="text" id="chat-input" placeholder="Ask something, e.g., 'Tell me about a city tour'" class="flex-1 w-full px-4 py-3 bg-gray-100 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 transition-shadow" autocomplete="off">
                <button type="submit" class="bg-blue-500 text-white rounded-full p-3 hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-transform transform hover:scale-105">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </button>
            </form>
        </footer>
    </div>

    <script type="module">
        const chatArea = document.getElementById('chat-area');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const typingIndicator = document.getElementById('typing-indicator');

        // --- Simulated Local Data Source (The "Tool" Output) ---
        const localTallinnData = {
            "partner_tours": [
                {
                    "company": "CityScape",
                    "tourName": "Medieval Legends & Cobblestone Secrets",
                    "duration": "2.5 hours",
                    "price_eur": 35,
                    "description": "A guided walking tour through the heart of Tallinn's UNESCO-listed Old Town. Discover hidden courtyards, hear tales of medieval merchants, and see iconic landmarks like Toompea Castle and Alexander Nevsky Cathedral.",
                    "contact": {
                        "phone": "+372 555 12345",
                        "email": "bookings@tallinntours.ee",
                        "website": "https://www.tallinntours.ee"
                    },
                    "booking_required": true
                }
            ],
            "transport_info": {
                "general_advice": "Tallinn has an efficient public transport system of trams and buses. Use a 'Ühiskaart' (green card) or buy tickets from the driver. Bolt is the most popular ride-sharing app.",
                "from_airport_to_old_town": "Tram line 4 goes directly from the airport to the city centre near the Old Town. A Bolt ride is typically around 10-15 EUR."
            },
            "current_weather": {
                "temperature_celsius": 14,
                "condition": "Partly cloudy with a light breeze",
                "recommendation": "It's pleasant, but a light jacket is recommended, especially in the evenings."
            }
        };


        const addMessage = (sender, message) => {
            const messageWrapper = document.createElement('div');
            const isUser = sender === 'user';

            messageWrapper.className = `flex items-start gap-3 ${isUser ? 'justify-end' : 'justify-start'}`;

            const iconHtml = isUser ? `
                <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center flex-shrink-0">
                   <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 A 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>` : `
                <div class="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center flex-shrink-0">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                </div>`;

            const bubbleClass = isUser ? 'chat-bubble-user rounded-br-none' : 'chat-bubble-ai rounded-tl-none';
            const messageHtml = `
                <div class="chat-bubble ${bubbleClass} p-4 rounded-lg max-w-sm">
                    <p class="text-sm">${message}</p>
                </div>
            `;

            // Order matters for flexbox justify-end
            if (isUser) {
                messageWrapper.innerHTML = messageHtml + iconHtml;
            } else {
                messageWrapper.innerHTML = iconHtml + messageHtml;
            }

            chatArea.querySelector('.space-y-6').appendChild(messageWrapper);
            chatArea.scrollTop = chatArea.scrollHeight;
        };

        const callGemini = async (userQuery) => {
            typingIndicator.classList.remove('hidden');
            chatArea.scrollTop = chatArea.scrollHeight;

            const apiKey = ""; // Canvas will provide the key
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

            const systemPrompt = `You are the "Tallinn Concierge," a friendly and helpful AI assistant for hotel guests in Tallinn, Estonia. Your tone is warm, welcoming, and slightly informal. You must use the provided JSON data to answer user questions. Do not make up information. If the user asks for something outside the provided data, politely say you don't have that information. Keep answers concise and helpful. Always answer in UK English.

            Here is the real-time data from your 'tools':
            ${JSON.stringify(localTallinnData, null, 2)}
            `;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                },
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`API call failed with status: ${response.status}`);
                }

                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;

                if (text) {
                    addMessage('ai', text);
                } else {
                    addMessage('ai', "I'm sorry, I couldn't generate a response. Please try again.");
                    console.error("No text in Gemini response:", result);
                }

            } catch (error) {
                console.error("Error calling Gemini API:", error);
                addMessage('ai', "I'm having a little trouble connecting right now. Please try again in a moment.");
            } finally {
                typingIndicator.classList.add('hidden');
                chatArea.scrollTop = chatArea.scrollHeight;
            }
        };

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const userInput = chatInput.value.trim();
            if (userInput) {
                addMessage('user', userInput);
                callGemini(userInput);
                chatInput.value = '';
            }
        });

    </script>
</body>
</html>
